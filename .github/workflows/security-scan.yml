name: Container Security Scan

# Trigger: scan otomatis pada push dan pull request
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build -f Dockerfile.secure \
            -t my-app:${{ github.sha }} .

      # 3. Jalankan Trivy untuk scan image dan menghasilkan SARIF
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "my-app:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      # 4. Diagnostic: tampilkan daftar temuan dalam format tabel
      - name: Show Trivy findings
        if: always()
        continue-on-error: true
        run: |
          trivy image \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            my-app:${{ github.sha }}

      # 5. Upload hasil SARIF ke GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "container-scanning"
